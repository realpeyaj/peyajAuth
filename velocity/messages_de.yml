# Sprachkonfiguration für peyajAuth Velocity (Deutsch)
# MiniMessage-Format mit Unterstützung für HEX-Farben und Farbverläufe.

prefix: "<gradient:gold:yellow>[peyajAuth]</gradient> "

auth:
  not-logged-in: "<red>Du musst dich authentifizieren, um auf diesem Server zu spielen!</red>"
  please-register: "<yellow>Bitte registriere dich mit: <gold>/register <passwort> <passwortWiederholen></gold></yellow>"
  please-login: "<yellow>Bitte melde dich an mit: <gold>/login <passwort></gold></yellow>"
  already-authenticated: "<red>Du bist bereits angemeldet!</red>"
  already-registered: "<red>Dieser Account ist bereits registriert! Bitte logge dich ein.</red>"
  success-register: "<green>Du hast dich erfolgreich registriert und eingeloggt!</green>"
  success-login: "<green>Du hast dich erfolgreich angemeldet!</green>"
  success-logout: "<green>Du wurdest abgemeldet. Bitte authentifiziere dich erneut.</green>"
  success-change-password: "<green>Dein Passwort wurde erfolgreich geändert!</green>"
  not-registered: "<red>Dein Account ist noch nicht registriert!</red>"
  incorrect-password: "<red>Falsches Passwort! Bitte versuche es erneut.</red>"
  password-mismatch: "<red>Die Passwörter stimmen nicht überein!</red>"
  login-timeout: "<red>Zeitlimit für die Anmeldung überschritten!</red>"
  premium-autologin: "<green>Premium-Account erkannt! Du wurdest automatisch eingeloggt.</green>"
  bedrock-autologin: "<green>Bedrock-Account erkannt! Du wurdest eingeloggt.</green>"
  session-resume: "<green>Deine Spielsitzung wurde fortgesetzt.</green>"
  2fa-required-proxy: "<yellow>Dieser Account nutzt 2FA. Nutze: <gold>/login <passwort> <code></gold></yellow>"
  too-many-attempts: "<red>Zu viele fehlgeschlagene Anmeldeversuche.</red>"
  access-denied-ip: "<red>Zugriff verweigert: Du bist nicht berechtigt, dich von dieser IP anzumelden.</red>"
  disallowed-username: "<red>Dein Benutzername enthält unzulässige Zeichen oder gesperrte Muster.</red>"
  already-online: "<red>Ein Spieler mit diesem Benutzernamen spielt bereits auf diesem Server!</red>"
  premium-prompt-title: "{prefix}"
  premium-prompt-subtitle: "<yellow>Bist du Premium? Wähle <green>JA</green> oder <red>NEIN</red> im Chat</yellow>"
  premium-prompt-question: "Besitzt du einen <gold><b>Premium</b></gold> (Mojang/Microsoft) Account?"
  premium-prompt-yes: "<green><b> ▶ JA </b></green>"
  premium-prompt-yes-hover: "<green>Klicke hier zur Bestätigung deines Premium-Accounts.\nDu wirst einmal getrennt und musst erneut beitreten.</green>"
  premium-prompt-no: "<red><b> ▶ NEIN </b></red>"
  premium-prompt-no-hover: "<red>Klicke hier zur Registrierung als Cracked-Spieler.\nDu wirst aufgefordert, ein Passwort zu setzen.</red>"
  premium-prompt-note: "<gray><i>Wenn Premium, wirst du zur Verifizierung einmal getrennt.</i></gray>"
  auth-timeout: "<red>Zeitlimit für Authentifizierung überschritten.</red>"
  server-change-denied: "<red>Du musst dich authentifizieren, bevor du den Server wechselst!</red>"
  mojang-authenticated: "<green>Willkommen zurück! Über Mojang authentifiziert.</green>"
  gateway-disconnect: "<red>Vom Authentifizierungs-Gateway getrennt: {reason}</red>"
  chat-disabled: "<red>Der Chat ist deaktiviert, bis du dich angemeldet hast!</red>"
  command-disabled: "<red>Du musst dich anmelden, bevor du Befehle ausführen kannst.</red>"
  title-auth-required: "<gold><bold>Authentifizierung Erforderlich</bold></gold>"
  title-please-login: "<gray>Bitte tippe <yellow>/login <passwort></yellow></gray>"
  title-please-register: "<gray>Bitte tippe <yellow>/register <passwort> <bestätigen></yellow></gray>"
  captcha-required: "<red>Bitte löse zuerst das Captcha mit /captcha <code>.</red>"
  register-usage: "<red>Verwendung: /register <passwort> <passwortWiederholen></red>"
  registering: "<yellow>Account wird registriert...</yellow>"
  register-failed-username: "<red>Registrierung fehlgeschlagen. Der Benutzername ist bereits vergeben.</red>"
  has-account-use-login: "<red>Du hast bereits einen Account. Bitte nutze /login <passwort>.</red>"
  premium-no-logout: "<red>Premium-Spieler können sich nicht abmelden.</red>"
  unregistered: "<red>Dein Account wurde gelöscht.</red>"
  unregistered-admin: "<red>Dein Account wurde von einem Administrator gelöscht.</red>"
  password-changed-admin: "<yellow>Dein Passwort wurde von einem Administrator geändert.</yellow>"
  premium-no-unregister: "<red>Premium-Accounts können nicht gelöscht werden.</red>"

captcha:
  gui-title: "Klicke auf das Ziel-Item: <green>{target}</green>"
  prompt: "<yellow>Löse das Captcha zum Fortfahren! Code: <gold>{code}</gold> (Tippe: <gold>/captcha <code></gold>)</yellow>"
  failed: "<red>Falsches Captcha! Bitte versuche es erneut.</red>"
  success: "<green>Captcha erfolgreich gelöst! Du kannst dich jetzt anmelden.</green>"

validation:
  password-too-short: "<red>Das Passwort muss mindestens {min} Zeichen lang sein!</red>"
  password-too-long: "<red>Das Passwort darf maximal {max} Zeichen lang sein!</red>"
  password-require-number: "<red>Das Passwort muss mindestens eine Zahl enthalten!</red>"
  password-require-uppercase: "<red>Das Passwort muss mindestens einen Großbuchstaben enthalten!</red>"
  password-require-lowercase: "<red>Das Passwort muss mindestens einen Kleinbuchstaben enthalten!</red>"
  password-length: "<red>Das Passwort muss zwischen {min} und {max} Zeichen lang sein.</red>"
  password-unsafe: "<red>Dieses Passwort ist zu unsicher! Wähle ein stärkeres Passwort.</red>"
  password-contains-username: "<red>Das Passwort darf deinen Benutzernamen nicht enthalten!</red>"
  max-accounts-exceeded: "<red>Du hast das Limit für erlaubte Accounts auf deiner IP-Adresse erreicht ({max})!</red>"

bruteforce:
  account-locked: "<red>Dein Account wurde wegen zu vieler Fehlversuche gesperrt! Versuche es in {minutes} Minuten erneut.</red>"
  ip-locked: "<red>Deine IP-Adresse wurde wegen zu vieler Fehlversuche gesperrt! Versuche es in {minutes} Minuten erneut.</red>"
  admin-alert: "{prefix}<gold>WARNUNG: Spieler {player} (IP: {ip}) hat {attempts} fehlgeschlagene Login-Versuche!</gold>"

admin:
  reload: "<green>Konfigurationen erfolgreich neu geladen!</green>"
  player-not-found: "<red>Spieler {player} wurde nicht gefunden.</red>"
  force-login-success: "<green>Login für Spieler {player} wurde erzwungen.</green>"
  force-logout-success: "<green>Abmeldung für Spieler {player} wurde erzwungen.</green>"
  unregister-success: "<green>Registrierung für Spieler {player} wurde gelöscht.</green>"
  change-password-success: "<green>Passwort für Spieler {player} erfolgreich geändert.</green>"
  set-premium-success: "<green>Auth-Modus für {player} auf PREMIUM gesetzt.</green>"
  set-cracked-success: "<green>Auth-Modus für {player} auf CRACKED gesetzt.</green>"
  info-title: "<yellow>---</yellow> {prefix}<yellow>Account-Informationen: <gold>{player}</gold> ---</yellow>"
  info-uuid-offline: "<yellow>Offline-UUID: <gold>{uuid}</gold></yellow>"
  info-uuid-premium: "<yellow>Premium-UUID: <gold>{uuid}</gold></yellow>"
  info-premium-status: "<yellow>Ist Premium: <gold>{status}</gold></yellow>"
  info-last-ip: "<yellow>Letzte IP: <gold>{ip}</gold></yellow>"
  info-last-login: "<yellow>Letzter Login: <gold>{time}</gold></yellow>"
  info-first-join: "<yellow>Erster Beitritt: <gold>{time}</gold></yellow>"

general:
  no-permission: "<red>Du hast keine Berechtigung für diesen Befehl!</red>"
  only-players: "<red>Dieser Befehl kann nur von Spielern ausgeführt werden!</red>"
  invalid-syntax: "<red>Ungültige Syntax! Verwendung: {usage}</red>"
  database-error: "<red>Ein Datenbankfehler ist aufgetreten. Bitte versuche es später erneut.</red>"
