  title-please-login: "<gray>Veuillez taper <yellow>/login <motDePasse></yellow></gray>"
  title-please-register: "<gray>Veuillez taper <yellow>/register <motDePasse> <confirmer></yellow></gray>"
  captcha-required: "<red>Vous devez résoudre le captcha d'abord avec /captcha <code>.</red>"
