  mojang-authenticated: "<green>Bon retour parmi nous ! Authentifié via Mojang.</green>"
  gateway-disconnect: "<red>Déconnecté de la passerelle d'authentification : {reason}</red>"
  chat-disabled: "<red>Le tchat est désactivé jusqu'à ce que vous soyez authentifié !</red>"
