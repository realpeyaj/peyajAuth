# General settings
general:
  # Language locale for messages:
  # 'auto' - Automatically detects player client language
  # 'en' - English, 'es' - Spanish, 'ru' - Russian, 'uk' - Ukrainian, 'zh' - Chinese, 'pt' - Portuguese, 'id' - Indonesian, 'fr' - French, 'de' - German, 'tr' - Turkish
  language: "auto"

# Timeout in seconds to complete authentication before being kicked
login-timeout: 60

# Captcha verification settings for cracked players joining the proxy
captcha:
  enabled: false

# Session system settings
session:
  enabled: true
  # Session expiration duration for IP-lock auto-login (e.g. 30m, 1h)
  timeout: "30m"
  # If true, allows session resumption from the same subnet (/24 for IPv4, /64 for IPv6)
  subnet-check: false

# Remember Login settings (IP-based auto-login duration)
remember-login:
  enabled: true
  duration: "7d"

# Password rules settings
password:
  minimum-length: 8
  maximum-length: 64
  # If true, requires at least one digit in the password
  require-number: false
  # If true, requires at least one uppercase letter
  require-uppercase: false
  # If true, requires at least one lowercase letter
  require-lowercase: false
  # If true, prevents players from registering passwords matching or containing their username
  disallow-username: true
  # Blacklisted weak passwords that players cannot use for registration
  unsafe-passwords:
    - "123456"
    - "password"
    - "qwerty"
    - "admin123"
    - "12345678"
    - "123456789"
    - "help"

# Brute-force protection settings
brute-force:
  max-attempts: 5

# Security & Restriction configurations
security:
  # Regex pattern of allowed characters in the player name.
  # Leave empty ("") to allow default Minecraft and Bedrock username patterns.
  # Both 'allowed-username-regex' and 'allowedNicknameCharacters' are supported.
  # Example to block bot names like lobbyLink: "^(?!.*(?i)lobbylink)[a-zA-Z0-9_]*$"
  allowed-username-regex: ""

  # Optional regex pattern of explicitly banned usernames or bot keywords.
  # If a connecting username matches this regex, they are immediately disconnected.
  # Example: "(?i).*(lobbylink|discord\\.gg|mc-server).*"
  banned-username-regex: ""

  # Prevent duplicate logins while a player with the same username is already connected.
  # This stops bot attacks from kicking legitimate players with "You logged in from another location".
  prevent-duplicate-login: true

  # If true, allows a reconnecting player with the exact same IP address to rejoin and kick
  # their previous stale session (e.g. after a client crash or timeout).
  allow-same-ip-reconnect: true

  # Unrestricted player/bot/NPC names that bypass authentication checks (wildcards supported)
  # Example:
  # unrestricted-names:
  #   - "BuildCraft"
  #   - "[Citizens]*"
  #   - "ServerBot_*"
  unrestricted-names: []

  # Account IP lock: Binds specific account names to allowed IP addresses or subnets.
  # Wildcards (*) and subnets are supported (format: "Username;AllowedIP_or_Pattern").
  # Example:
  # account-ip-locks:
  #   - "Peyaj;192.168.1.*"
  #   - "AdminUser;10.0.0.50"
  account-ip-locks: []

# Network/Proxy specific settings
proxy:
  # If true, players will automatically be redirected to the server determined by Velocity's [forced-hosts]
  # in velocity.toml upon authenticating. If false, or if no forced host matched, they are sent to success-target-server.
  follow-forced-hosts: true
  # The backend server to send players to once they authenticate successfully (or fallback if no forced host matched)
  success-target-server: "lobby"

# Embedded Limbo virtual void world settings
limbo:
  # Set to false to use your own backend auth lobby server instead of the embedded Limbo void
  enabled: true
  # The initial backend server where unauthenticated players join when limbo.enabled is false:
  auth-server: "auth"
  # Dimension type: 'minecraft:the_end', 'minecraft:overworld', or 'minecraft:the_nether'
  # Note: 'minecraft:the_end' provides the dark purple End sky void aesthetic for 1.21.6+ (26.2) clients.
  # If older 1.21.5 (26.1.2) clients experience Network Protocol Errors, change this to 'minecraft:overworld'.
  dimension: "minecraft:the_end"

# Proxy-to-backend authentication bridge security settings
bridge:
  # Secret key to sign sync packets sent from Velocity to backend Paper servers.
  # If configured, this must match bridge.secret in your backend Paper config.yml.
  secret: ""

# Discord Webhook Integration
# Send real-time security alerts and administrative audit logs to a Discord channel
webhook:
  enabled: false
  # Discord webhook URL (e.g., https://discord.com/api/webhooks/...)
  url: ""
  # Custom bot name displayed on webhook messages
  bot-name: "peyajAuth"
  # Custom avatar image URL for the webhook bot
  avatar-url: ""
  # Mask the last part of IP addresses for privacy/GDPR (e.g., 192.168.1.***)
  mask-ips: false
  # Event toggles
  events:
    register: true
    login-success: false
    login-failed: true
    lockout: true
    password-change: true
    two-factor: true
    admin-actions: true

# Automated SQLite database backup settings
# (Backups are compressed in GZIP format to save disk space)
database-backups:
  enabled: true
  # Interval in hours between backups (default: 24 hours)
  interval-hours: 24
  # Maximum number of backup files to keep (oldest are deleted automatically)
  retention-limit: 7

