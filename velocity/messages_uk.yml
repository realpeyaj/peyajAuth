  chat-disabled: "<red>Чат недоступний, доки ви не пройдете автентифікацію!</red>"
  command-disabled: "<red>Перед виконанням команд необхідно пройти автентифікацію.</red>"
  title-auth-required: "<gold><bold>Необхідна автентифікація</bold></gold>"
  title-please-login: "<gray>Будь ласка, введіть <yellow>/login <пароль></yellow></gray>"
  title-please-register: "<gray>Будь ласка, введіть <yellow>/register <пароль> <підтвердження_паролю></yellow></gray>"
  captcha-required: "<red>Спочатку вам потрібно пройти CAPTCHA за допомогою команди /captcha <код>.</red>"
