  please-login: "<yellow>Будь ласка, увійдіть за допомогою команди: <gold>/login <пароль></gold></yellow>"
  already-authenticated: "<red>Ви вже увійшли!</red>"
  already-registered: "<red>Гравець вже зареєстрований! Будь ласка, увійдіть.</red>"
  success-register: "<green>Ви успішно зареєструвалися та увійшли!</green>"
  success-login: "<green>Ви успішно увійшли!</green>"
  success-logout: "<green>Ви вийшли. Перезайдіть, щоб продовжити гру.</green>"
  success-change-password: "<green>Ваш пароль успішно змінено!</green>"
  not-registered: "<red>Гравець ще не зареєстрований!</red>"
  incorrect-password: "<red>Неправильний пароль! Спробуйте ще раз.</red>"
  password-mismatch: "<red>Паролі не збігаються!</red>"
  login-timeout: "<red>Ви занадто довго входили!</red>"
