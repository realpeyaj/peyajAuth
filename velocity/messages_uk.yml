captcha:
  gui-title: "Натисніть на потрібний предмет: <green>{target}</green>"
  prompt: "<yellow>Пройдіть CAPTCHA для авторизації/входу! Код: <gold>{code}</gold> (Введіть: <gold>/captcha <код></gold>)</yellow>"
  failed: "<red>Неправильна CAPTCHA! Спробуйте ще раз.</red>"
  success: "<green>CAPTCHA успішно пройдена! Тепер ви можете пройти автентифікацію.</green>"

validation:
  password-too-short: "<red>Пароль повинен містити щонайменше {min} символи!</red>"
  password-too-long: "<red>Довжина пароля не може перевищувати {max} символи!</red>"
  password-unsafe: "<red>Цей пароль занадто поширений! Будь ласка, оберіть надійніший пароль.</red>"
  password-require-number: "<red>Пароль повинен містити принаймні одну цифру!</red>"
  password-require-uppercase: "<red>Пароль повинен містити принаймні одну велику літеру!</red>"
  password-require-lowercase: "<red>Пароль повинен містити принаймні одну малу літеру!</red>"
  max-accounts-exceeded: "<red>Ви досягли максимальної кількості облікових записів, дозволених для вашої IP-адреси ({max})!</red>"

bruteforce:
  account-locked: "<red>Ваш обліковий запис було заблоковано через надто велику кількість невдалих спроб входу! Спробуйте ще раз через {minutes} хвилин.</red>"
  ip-locked: "<red>Ваша IP-адреса була заблокована через надто велику кількість невдалих спроб входу! Спробуйте ще раз через {minutes} хвилин.</red>"
  admin-alert: "{prefix}<gold>ПОПЕРЕДЖЕННЯ: Гравець {player} (IP: {ip}) здійснив {attempts} невдалих спроб входу!</gold>"

admin:
  reload: "{prefix}<green>Успішно перезавантажено конфігурацію!</green>"
  player-not-found: "<red>Гравця {player} не знайдено.</red>"
  force-login-success: "<green>Гравця {player} успішно змушено увійти.</green>"
  force-logout-success: "<green>Гравця {player} успішно змушено вийти.</green>"
  unregister-success: "<green>Гравця {player} успішно видалено.</green>"
  set-premium-success: "<green>Режим входу {player} успішно встановлений на PREMIUM.</green>"
  set-cracked-success: "<green>Режим входу {player} успішно встановлений на CRACKED.</green>"
  info-title: "<yellow>---</yellow> {prefix}<yellow>Інформація про обліковий запис: <gold>{player}</gold> ---</yellow>"
  info-uuid-offline: "<yellow>Offline UUID: <gold>{uuid}</gold></yellow>"
  info-uuid-premium: "<yellow>Premium UUID: <gold>{uuid}</gold></yellow>"
  info-premium-status: "<yellow>Premium: <gold>{status}</gold></yellow>"
  info-last-ip: "<yellow>IP-адреса останнього входу: <gold>{ip}</gold></yellow>"
  info-last-login: "<yellow>Останній вхід: <gold>{time}</gold></yellow>"
  info-first-join: "<yellow>Перший вхід: <gold>{time}</gold></yellow>"

general:
  no-permission: "<red>У вас немає дозволу на виконання цієї команди!</red>"
  only-players: "<red>Цю команду можуть виконувати лише гравці!</red>"
  invalid-syntax: "<red>Неправильний синтаксис! Правильне використання: {usage}</red>"
