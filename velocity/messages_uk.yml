# Конфігурація локалізації для peyajAuth із використанням формату MiniMessage (Українська)
# Підтримуються всі стандартні RGB, градієнти та стилі.

prefix: "<gradient:gold:yellow>[peyajAuth]</gradient> "

auth:
  not-logged-in: "<red>Щоб грати на цьому сервері, необхідно зареєструватися!</red>"
