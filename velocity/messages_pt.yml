# Configuração de localização para peyajAuth Velocity (Português)
# Formato MiniMessage com suporte a cores HEX e gradientes.

prefix: "<gradient:gold:yellow>[peyajAuth]</gradient> "

auth:
  not-logged-in: "<red>Você deve se autenticar para jogar neste servidor!</red>"
  please-register: "<yellow>Por favor registre-se usando: <gold>/register <senha> <confirmarSenha></gold></yellow>"
  please-login: "<yellow>Por favor faça login usando: <gold>/login <senha></gold></yellow>"
  already-authenticated: "<red>Você já está autenticado!</red>"
  already-registered: "<red>Esta conta já está registrada! Por favor, faça login.</red>"
  success-register: "<green>Você se registrou e entrou com sucesso!</green>"
  success-login: "<green>Você entrou com sucesso!</green>"
  success-logout: "<green>Você saiu da conta. Autentique-se novamente para jogar.</green>"
  success-change-password: "<green>Sua senha foi alterada com sucesso!</green>"
  not-registered: "<red>Sua conta ainda não está registrada!</red>"
  incorrect-password: "<red>Senha incorreta! Tente novamente.</red>"
  password-mismatch: "<red>As senhas não coincidem!</red>"
  login-timeout: "<red>Tempo limite para autenticação esgotado!</red>"
  premium-autologin: "<green>Conta original (premium) detectada! Você foi autenticado automaticamente.</green>"
  bedrock-autologin: "<green>Conta Bedrock detectada! Você foi autenticado.</green>"
  session-resume: "<green>Sua sessão de jogo foi retomada.</green>"
  2fa-required-proxy: "<yellow>Esta conta usa 2FA. Use: <gold>/login <senha> <código></gold></yellow>"
  too-many-attempts: "<red>Muitas tentativas incorretas de login.</red>"
  access-denied-ip: "<red>Acesso negado: Você não está autorizado a entrar a partir deste IP.</red>"
  disallowed-username: "<red>Seu nome de usuário contém caracteres não permitidos ou padrões proibidos.</red>"
  already-online: "<red>Um jogador com este nome de usuário já está jogando neste servidor!</red>"
  premium-prompt-title: "{prefix}"
  premium-prompt-subtitle: "<yellow>Você é premium? Escolha <green>SIM</green> ou <NÃO> no chat</yellow>"
  premium-prompt-question: "Você possui uma conta <gold><b>original / premium</b></gold> (Mojang/Microsoft)?"
  premium-prompt-yes: "<green><b> ▶ SIM </b></green>"
  premium-prompt-yes-hover: "<green>Clique para verificar sua conta premium.\nVocê será desconectado e deverá reconectar.</green>"
  premium-prompt-no: "<red><b> ▶ NÃO </b></red>"
  premium-prompt-no-hover: "<red>Clique para se registrar como jogador pirata.\nVocê poderá definir sua senha.</red>"
  premium-prompt-note: "<gray><i>Se for premium, você será desconectado uma vez para verificar.</i></gray>"
  auth-timeout: "<red>Tempo limite de autenticação esgotado.</red>"
  server-change-denied: "<red>Você deve se autenticar antes de mudar de servidor!</red>"
  mojang-authenticated: "<green>Bem-vindo de volta! Autenticado via Mojang.</green>"
  gateway-disconnect: "<red>Desconectado do portal de autenticação: {reason}</red>"
  chat-disabled: "<red>O chat está desativado até que você se autentique!</red>"
  command-disabled: "<red>Você deve se autenticar antes de executar comandos.</red>"
  title-auth-required: "<gold><bold>Autenticação Necessária</bold></gold>"
  title-please-login: "<gray>Por favor digite <yellow>/login <senha></yellow></gray>"
  title-please-register: "<gray>Por favor digite <yellow>/register <senha> <confirmar></yellow></gray>"
  captcha-required: "<red>Você deve resolver o captcha primeiro usando /captcha <código>.</red>"
  register-usage: "<red>Uso: /register <senha> <confirmarSenha></red>"
  registering: "<yellow>Registrando conta...</yellow>"
  register-failed-username: "<red>Falha no registro. O nome de usuário já está registrado.</red>"
  has-account-use-login: "<red>Você já possui uma conta. Use /login <senha>.</red>"
  premium-no-logout: "<red>Jogadores premium não podem sair da conta.</red>"
  unregistered: "<red>Sua conta foi desregistrada.</red>"
  unregistered-admin: "<red>Sua conta foi desregistrada por um administrador.</red>"
  password-changed-admin: "<yellow>Sua senha foi alterada por um administrador.</yellow>"
  premium-no-unregister: "<red>Contas premium não podem ser desregistradas.</red>"

captcha:
  gui-title: "Clique no item: <green>{target}</green>"
  prompt: "<yellow>Resolva o captcha para continuar! Código: <gold>{code}</gold> (Digite: <gold>/captcha <code></gold>)</yellow>"
  failed: "<red>Captcha incorreto! Tente novamente.</red>"
  success: "<green>Captcha resolvido com sucesso! Agora você pode se autenticar.</green>"

validation:
  password-too-short: "<red>A senha deve ter pelo menos {min} caracteres!</red>"
  password-too-long: "<red>A senha não pode ter mais de {max} caracteres!</red>"
  password-require-number: "<red>A senha deve conter pelo menos um número!</red>"
  password-require-uppercase: "<red>A senha deve conter pelo menos uma letra maiúscula!</red>"
  password-require-lowercase: "<red>A senha deve conter pelo menos uma letra minúscula!</red>"
  password-length: "<red>A senha deve ter entre {min} e {max} caracteres.</red>"
  password-unsafe: "<red>Esta senha é muito comum ou insegura! Escolha uma mais forte.</red>"
  password-contains-username: "<red>A senha não pode conter ou ser igual ao seu nome de usuário!</red>"
  max-accounts-exceeded: "<red>Você atingiu o limite máximo de contas permitidas para o seu IP ({max})!</red>"

bruteforce:
  account-locked: "<red>Sua conta foi bloqueada devido a muitas tentativas incorretas! Tente novamente em {minutes} minutos.</red>"
  ip-locked: "<red>Seu endereço IP foi bloqueado devido a muitas tentativas incorretas! Tente novamente em {minutes} minutos.</red>"
  admin-alert: "{prefix}<gold>ALERTA: O jogador {player} (IP: {ip}) falhou {attempts} tentativas de login!</gold>"

admin:
  reload: "<green>Configurações recarregadas com sucesso!</green>"
  player-not-found: "<red>O jogador {player} não foi encontrado.</red>"
  force-login-success: "<green>O login do jogador {player} foi forçado com sucesso.</green>"
  force-logout-success: "<green>A desconexão do jogador {player} foi forçada com sucesso.</green>"
  unregister-success: "<green>O registro do jogador {player} foi removido com sucesso.</green>"
  change-password-success: "<green>Senha alterada com sucesso para o jogador {player}.</green>"
  set-premium-success: "<green>Modo de autenticação de {player} definido como PREMIUM.</green>"
  set-cracked-success: "<green>Modo de autenticação de {player} definido como CRACKED.</green>"
  info-title: "<yellow>---</yellow> {prefix}<yellow>Informações da conta: <gold>{player}</gold> ---</yellow>"
  info-uuid-offline: "<yellow>UUID Offline: <gold>{uuid}</gold></yellow>"
  info-uuid-premium: "<yellow>UUID Premium: <gold>{uuid}</gold></yellow>"
  info-premium-status: "<yellow>É Premium: <gold>{status}</gold></yellow>"
  info-last-ip: "<yellow>Último IP: <gold>{ip}</gold></yellow>"
  info-last-login: "<yellow>Último login: <gold>{time}</gold></yellow>"
  info-first-join: "<yellow>Primeiro acesso: <gold>{time}</gold></yellow>"

general:
  no-permission: "<red>Você não tem permissão para executar este comando!</red>"
  only-players: "<red>Este comando só pode ser executado por jogadores!</red>"
  invalid-syntax: "<red>Sintaxe inválida! Uso: {usage}</red>"
  database-error: "<red>Ocorreu um erro no banco de dados. Tente novamente mais tarde.</red>"
