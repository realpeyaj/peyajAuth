# Configuración de localización para peyajAuth (Español)
# Formato MiniMessage con soporte para colores HEX y gradientes.

prefix: "<gradient:gold:yellow>[peyajAuth]</gradient> "

auth:
  not-logged-in: "<red>¡Debes autenticarte para jugar en este servidor!</red>"
  please-register: "<yellow>Por favor regístrate usando: <gold>/register <contraseña> <confirmarContraseña></gold></yellow>"
  please-login: "<yellow>Por favor inicia sesión usando: <gold>/login <contraseña></gold></yellow>"
  already-authenticated: "<red>¡Ya estás autenticado!</red>"
  already-registered: "<red>¡Esta cuenta ya está registrada! Por favor inicia sesión.</red>"
  success-register: "<green>¡Te has registrado e iniciado sesión exitosamente!</green>"
  success-login: "<green>¡Has iniciado sesión exitosamente!</green>"
  success-logout: "<green>Has cerrado sesión. Vuelve a autenticarte para jugar.</green>"
  success-change-password: "<green>¡Tu contraseña ha sido cambiada exitosamente!</green>"
  not-registered: "<red>¡Tu cuenta aún no está registrada!</red>"
  incorrect-password: "<red>¡Contraseña incorrecta! Inténtalo de nuevo.</red>"
  password-mismatch: "<red>¡Las contraseñas no coinciden!</red>"
  login-timeout: "<red>¡Tiempo de espera para iniciar sesión agotado!</red>"
  premium-autologin: "<green>¡Cuenta premium detectada! Has iniciado sesión automáticamente.</green>"
  bedrock-autologin: "<green>¡Cuenta Bedrock detectada! Has iniciado sesión.</green>"
  session-resume: "<green>Tu sesión de juego ha sido reanudada.</green>"
  please-2fa: "<yellow>Por favor verifica tu código 2FA de tu aplicación Authenticator: <gold>/2fa verify <código></gold></yellow>"
  twofactor-timeout: "<red>¡Tiempo de verificación 2FA agotado!</red>"
  disconnect-message: "<red>Desconectado del servidor.</red>"

captcha:
  gui-title: "Haz clic en el objeto: <green>{target}</green>"
  prompt: "<yellow>¡Resuelve el captcha para continuar! Código: <gold>{code}</gold> (Escribe: <gold>/captcha <code></gold>)</yellow>"
  failed: "<red>¡Captcha incorrecto! Inténtalo de nuevo.</red>"
  success: "<green>¡Captcha resuelto exitosamente! Ahora puedes autenticarte.</green>"

validation:
  password-too-short: "<red>¡La contraseña debe tener al menos {min} caracteres!</red>"
  password-too-long: "<red>¡La contraseña no puede tener más de {max} caracteres!</red>"
  password-unsafe: "<red>¡Esta contraseña es demasiado común o insegura! Elige una más fuerte.</red>"
  password-require-number: "<red>¡La contraseña debe contener al menos un número!</red>"
  password-require-uppercase: "<red>¡La contraseña debe contener al menos una letra mayúscula!</red>"
  password-require-lowercase: "<red>¡La contraseña debe contener al menos una letra minúscula!</red>"
  max-accounts-exceeded: "<red>¡Has alcanzado el límite máximo de cuentas permitidas para tu IP ({max})!</red>"

bruteforce:
  account-locked: "<red>¡Tu cuenta ha sido bloqueada por demasiados intentos fallidos! Inténtalo en {minutes} minutos.</red>"
  ip-locked: "<red>¡Tu IP ha sido bloqueada por demasiados intentos fallidos! Inténtalo en {minutes} minutos.</red>"
  admin-alert: "{prefix}<gold>ALERTA: ¡El jugador {player} (IP: {ip}) ha fallado {attempts} intentos de inicio de sesión!</gold>"

admin:
  reload: "<green>¡Configuraciones recargadas exitosamente!</green>"
  player-not-found: "<red>El jugador {player} no fue encontrado.</red>"
  force-login-success: "<green>Se forzó el inicio de sesión del jugador {player}.</green>"
  force-logout-success: "<green>Se forzó el cierre de sesión del jugador {player}.</green>"
  unregister-success: "<green>Se eliminó el registro del jugador {player}.</green>"
  set-premium-success: "<green>Se estableció el modo de autenticación de {player} a PREMIUM.</green>"
  set-cracked-success: "<green>Se estableció el modo de autenticación de {player} a CRACKED.</green>"
  info-title: "<yellow>---</yellow> {prefix}<yellow>Información de cuenta: <gold>{player}</gold> ---</yellow>"
  info-uuid-offline: "<yellow>UUID Offline: <gold>{uuid}</gold></yellow>"
  info-uuid-premium: "<yellow>UUID Premium: <gold>{uuid}</gold></yellow>"
  info-premium-status: "<yellow>Es Premium: <gold>{status}</gold></yellow>"
  info-last-ip: "<yellow>Última IP: <gold>{ip}</gold></yellow>"
  info-last-login: "<yellow>Último inicio: <gold>{time}</gold></yellow>"
  info-first-join: "<yellow>Primer ingreso: <gold>{time}</gold></yellow>"

general:
  no-permission: "<red>¡No tienes permiso para ejecutar este comando!</red>"
  only-players: "<red>¡Este comando solo puede ser ejecutado por jugadores!</red>"
  invalid-syntax: "<red>¡Sintaxis inválida! Uso: {usage}</red>"

email:
  no-email: "<red>¡No tienes un correo de recuperación configurado!</red>"
  current-email: "<yellow>Tu correo de recuperación es: <gold>{email}</gold></yellow>"
  invalid-email: "<red>¡Formato de correo inválido!</red>"
  pending-add: "<yellow>Confirma tu nuevo correo (<gold>{email}</gold>) escribiendo: <gold>/email confirm <código></gold></yellow>"
  pending-add-fallback: "<yellow>Confirma tu nuevo correo (<gold>{email}</gold>) escribiendo: <gold>/email confirm</gold></yellow>"
  pending-change: "<yellow>Confirma el cambio de correo a <gold>{email}</gold> escribiendo: <gold>/email confirm <código></gold></yellow>"
  pending-change-fallback: "<yellow>Confirma el cambio de correo a <gold>{email}</gold> escribiendo: <gold>/email confirm</gold></yellow>"
  pending-remove: "<yellow>Confirma la eliminación de tu correo escribiendo: <gold>/email confirm <código></gold></yellow>"
  pending-remove-fallback: "<yellow>Confirma la eliminación de tu correo escribiendo: <gold>/email confirm</gold></yellow>"
  no-pending: "<red>¡No tienes actualizaciones de correo pendientes!</red>"
  invalid-code: "<red>¡Código de verificación incorrecto! Inténtalo de nuevo.</red>"
  success-linked: "<green>¡Correo de recuperación <gold>{email}</gold> vinculado exitosamente!</green>"
  success-removed: "<green>¡Correo de recuperación eliminado exitosamente!</green>"
  smtp-error: "<red>¡Error al enviar correo! Usando confirmación local.</red>"

twofactor:
  already-enabled: "<red>¡La autenticación de dos factores ya está activada en tu cuenta!</red>"
  not-enabled: "<red>¡La autenticación de dos factores no está activada en tu cuenta!</red>"
  setup-intro: "<yellow>Configurando Google Authenticator (2FA):</yellow>"
  setup-key: "<yellow>Tu clave secreta: <gold>{key}</gold></yellow>"
  setup-qr: "<yellow>Haz clic aquí para escanear el código QR: <gold><click:open_url:'{url}'>[Escanear QR]</click></gold></yellow>"
  setup-confirm: "<yellow>Escanea el código y confirma escribiendo: <gold>/2fa confirm <código></gold></yellow>"
  no-pending: "<red>¡No has iniciado la configuración 2FA! Escribe /2fa setup primero.</red>"
  incorrect-code: "<red>¡Código de seguridad incorrecto! Inténtalo de nuevo.</red>"
  success-enabled: "<green>¡La autenticación de dos factores ha sido activada!</green>"
  success-disabled: "<green>¡La autenticación de dos factores ha sido desactivada!</green>"
  success-verified: "<green>¡Código 2FA verificado! Acceso concedido.</green>"
  admin-disabled: "<green>Se desactivó 2FA para el jugador {player}.</green>"
