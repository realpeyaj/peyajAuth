# Konfigurasi pesan untuk peyajAuth (Bahasa Indonesia)
# Format MiniMessage dengan dukungan warna HEX dan gradien.

prefix: "<gradient:gold:yellow>[peyajAuth]</gradient> "

auth:
  not-logged-in: "<red>Anda harus login untuk bermain di server ini!</red>"
  please-register: "<yellow>Silakan daftar menggunakan: <gold>/register <kataSandi> <konfirmasiKataSandi></gold></yellow>"
  please-login: "<yellow>Silakan masuk menggunakan: <gold>/login <kataSandi></gold></yellow>"
  already-authenticated: "<red>Anda sudah login!</red>"
  already-registered: "<red>Akun ini sudah terdaftar! Silakan login.</red>"
  success-register: "<green>Pendaftaran dan login berhasil!</green>"
  success-login: "<green>Anda berhasil masuk!</green>"
  success-logout: "<green>Anda telah keluar. Login kembali untuk bermain.</green>"
  success-change-password: "<green>Kata sandi Anda berhasil diubah!</green>"
  not-registered: "<red>Akun Anda belum terdaftar!</red>"
  incorrect-password: "<red>Kata sandi salah! Silakan coba lagi.</red>"
  password-mismatch: "<red>Kata sandi tidak cocok!</red>"
  login-timeout: "<red>Batas waktu login telah habis!</red>"
  premium-autologin: "<green>Akun premium terdeteksi! Anda telah login otomatis.</green>"
  bedrock-autologin: "<green>Akun Bedrock terdeteksi! Anda telah masuk.</green>"
  session-resume: "<green>Sesi bermain Anda telah dipulihkan.</green>"
  please-2fa: "<yellow>Verifikasi kode 2FA dari aplikasi Authenticator Anda: <gold>/2fa verify <kode></gold></yellow>"
  twofactor-timeout: "<red>Batas waktu verifikasi 2FA habis!</red>"
  disconnect-message: "<red>Terputus dari server.</red>"
  disallowed-username: "<red>Nama pengguna Anda mengandung karakter yang tidak diizinkan atau pola terlarang.</red>"
  already-online: "<red>Pemain dengan nama pengguna ini sudah bermain di server ini!</red>"
  password-changed-admin: "<yellow>Kata sandi Anda telah diubah oleh administrator.</yellow>"

captcha:
  gui-title: "Klik item target: <green>{target}</green>"
  prompt: "<yellow>Selesaikan captcha untuk melanjutkan! Kode: <gold>{code}</gold> (Ketik: <gold>/captcha <code></gold>)</yellow>"
  failed: "<red>Captcha salah! Silakan coba lagi.</red>"
  success: "<green>Captcha berhasil diselesaikan! Sekarang Anda dapat login.</green>"

validation:
  password-too-short: "<red>Kata sandi minimal harus {min} karakter!</red>"
  password-too-long: "<red>Kata sandi tidak boleh lebih dari {max} karakter!</red>"
  password-unsafe: "<red>Kata sandi ini terlalu umum atau tidak aman! Pilih kata sandi yang lebih kuat.</red>"
  password-require-number: "<red>Kata sandi harus mengandung setidaknya satu angka!</red>"
  password-require-uppercase: "<red>Kata sandi harus mengandung setidaknya satu huruf besar!</red>"
  password-require-lowercase: "<red>Kata sandi harus mengandung setidaknya satu huruf kecil!</red>"
  password-contains-username: "<red>Kata sandi tidak boleh mengandung nama pengguna Anda!</red>"
  max-accounts-exceeded: "<red>Batas maksimal akun untuk alamat IP Anda telah tercapai ({max})!</red>"

bruteforce:
  account-locked: "<red>Akun Anda terkunci karena terlalu banyak percobaan gagal! Coba lagi dalam {minutes} menit.</red>"
  ip-locked: "<red>Alamat IP Anda diblokir karena terlalu banyak percobaan gagal! Coba lagi dalam {minutes} menit.</red>"
  admin-alert: "{prefix}<gold>PERINGATAN: Pemain {player} (IP: {ip}) gagal login sebanyak {attempts} kali!</gold>"

admin:
  reload: "<green>Konfigurasi berhasil dimuat ulang!</green>"
  player-not-found: "<red>Pemain {player} tidak ditemukan.</red>"
  force-login-success: "<green>Berhasil memaksa pemain {player} untuk login.</green>"
  force-logout-success: "<green>Berhasil mengeluarkan pemain {player}.</green>"
  unregister-success: "<green>Pendaftaran akun {player} berhasil dihapus.</green>"
  change-password-success: "<green>Berhasil mengubah kata sandi untuk pemain {player}.</green>"
  set-premium-success: "<green>Mode autentikasi {player} diatur ke PREMIUM.</green>"
  set-cracked-success: "<green>Mode autentikasi {player} diatur ke CRACKED.</green>"
  info-title: "<yellow>---</yellow> {prefix}<yellow>Informasi Akun: <gold>{player}</gold> ---</yellow>"
  info-uuid-offline: "<yellow>UUID Offline: <gold>{uuid}</gold></yellow>"
  info-uuid-premium: "<yellow>UUID Premium: <gold>{uuid}</gold></yellow>"
  info-premium-status: "<yellow>Status Premium: <gold>{status}</gold></yellow>"
  info-last-ip: "<yellow>IP Terakhir: <gold>{ip}</gold></yellow>"
  info-last-login: "<yellow>Login Terakhir: <gold>{time}</gold></yellow>"
  info-first-join: "<yellow>Pertama Masuk: <gold>{time}</gold></yellow>"

general:
  no-permission: "<red>Anda tidak memiliki izin untuk perintah ini!</red>"
  only-players: "<red>Perintah ini hanya dapat digunakan oleh pemain!</red>"
  invalid-syntax: "<red>Format salah! Gunakan: {usage}</red>"
  database-error: "<red>Terjadi kesalahan basis data. Silakan coba lagi nanti.</red>"

email:
  no-email: "<red>Anda belum mengatur email pemulihan!</red>"
  current-email: "<yellow>Email pemulihan Anda saat ini: <gold>{email}</gold></yellow>"
  invalid-email: "<red>Format email tidak valid!</red>"
  pending-add: "<yellow>Konfirmasi email baru Anda (<gold>{email}</gold>) dengan mengetik: <gold>/email confirm <kode></gold></yellow>"
  pending-add-fallback: "<yellow>Konfirmasi email baru Anda (<gold>{email}</gold>) dengan mengetik: <gold>/email confirm</gold></yellow>"
  pending-change: "<yellow>Konfirmasi perubahan email ke <gold>{email}</gold> dengan mengetik: <gold>/email confirm <kode></gold></yellow>"
  pending-change-fallback: "<yellow>Konfirmasi perubahan email ke <gold>{email}</gold> dengan mengetik: <gold>/email confirm</gold></yellow>"
  pending-remove: "<yellow>Konfirmasi penghapusan email pemulihan dengan mengetik: <gold>/email confirm <kode></gold></yellow>"
  pending-remove-fallback: "<yellow>Konfirmasi penghapusan email pemulihan dengan mengetik: <gold>/email confirm</gold></yellow>"
  no-pending: "<red>Tidak ada pembaruan email yang tertunda!</red>"
  invalid-code: "<red>Kode verifikasi salah! Silakan coba lagi.</red>"
  success-linked: "<green>Email pemulihan <gold>{email}</gold> berhasil ditautkan!</green>"
  success-removed: "<green>Email pemulihan berhasil dihapus!</green>"
  smtp-error: "<red>Gagal mengirim email verifikasi! Menggunakan konfirmasi lokal.</red>"

twofactor:
  already-enabled: "<red>Autentikasi dua faktor (2FA) sudah aktif di akun Anda!</red>"
  not-enabled: "<red>Autentikasi dua faktor (2FA) belum aktif di akun Anda!</red>"
  setup-intro: "<yellow>Menyiapkan Google Authenticator (2FA):</yellow>"
  setup-key: "<yellow>Kunci rahasia Anda: <gold>{key}</gold></yellow>"
  setup-qr: "<yellow>Klik untuk menyalin tautan URI: <gold><click:copy_to_clipboard:'{url}'>[Salin URI]</click></gold></yellow>"
  setup-confirm: "<yellow>Pindai kode dan konfirmasi dengan mengetik: <gold>/2fa confirm <kode></gold></yellow>"
  no-pending: "<red>Anda belum memulai penyiapan 2FA! Ketik /2fa setup terlebih dahulu.</red>"
  incorrect-code: "<red>Kode keamanan salah! Silakan coba lagi.</red>"
  success-enabled: "<green>Autentikasi dua faktor (2FA) berhasil diaktifkan!</green>"
  success-disabled: "<green>Autentikasi dua faktor (2FA) berhasil dinonaktifkan!</green>"
  success-verified: "<green>Kode 2FA berhasil diverifikasi! Akses diberikan.</green>"
  admin-disabled: "<green>2FA berhasil dinonaktifkan untuk pemain {player}.</green>"
